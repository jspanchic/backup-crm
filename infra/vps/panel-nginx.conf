# Serves the panel and forwards /admin/ to core-api over the internal network.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's resolver. With a variable in proxy_pass, nginx resolves the name per request and starts even
    # when core-api is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;
    client_max_body_size 2m;

    location /admin/ {
        set $core_api http://core-api:3000;
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Hashed build files never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell and the service worker must be re-checked every time or an old panel keeps running.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
