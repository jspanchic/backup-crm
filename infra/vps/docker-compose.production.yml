# Apply after docker-compose.yml. The production database and documents must not share test volumes.
name: salvionix-crm-production

services:
  migrate:
    image: salvionix-crm/core-api:production

  core-api:
    image: salvionix-crm/core-api:production
    environment:
      NODE_ENV: production
      ADMIN_DEV_SUB: ""
      WAHA_HMAC_BYTOGAM_PRUEBAS: ""
      WAHA_HMAC_SALVIONIX: ${WAHA_HMAC_SALVIONIX:?missing WAHA_HMAC_SALVIONIX}
      WAHA_SEND_ENABLED: ${WAHA_SEND_ENABLED:-false}
      # The Javier copy owns pacing for this rollout.
      OUTBOX_PACE_MIN_MS: "0"
      OUTBOX_PACE_MAX_MS: "0"

  gateway:
    networks:
      n8n:
        aliases: !override [salvionix-core-api-production]

  panel:
    # The panel still needs production authentication (CRM-T3).
    profiles: [panel]
    image: salvionix-crm/panel:production
    build:
      args:
        PANEL_PRESENTATION_MODE: "false"
    ports: !override
      - "127.0.0.1:${PRODUCTION_PANEL_PORT:-8089}:8080"

networks:
  back:
    name: salvionix-crm-production_back
  edge:
    name: salvionix-crm-production_edge

volumes:
  db-data:
    name: salvionix-crm-production_db-data
  documents:
    name: salvionix-crm-production_documents
